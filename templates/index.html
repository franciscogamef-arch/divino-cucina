<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Divino & Cucina</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#121212;}
body{display:flex;flex-direction:column;color:#fff;max-width:480px;margin:0 auto;min-height:100vh;}
header{background:#161616;padding:16px 20px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.brand h1{font-size:18px;font-weight:800;letter-spacing:2px;color:#fff;}
.brand p{font-size:11px;letter-spacing:3px;color:#d4af37;text-transform:uppercase;margin-top:-2px;font-weight:600;}
main{flex:1;overflow-y:auto;padding:16px;background:#121212;-webkit-overflow-scrolling:touch;}
.screen{display:none;}.screen.active{display:block;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#d4af37;color:#000;padding:12px 24px;border-radius:30px;font-size:13px;font-weight:700;z-index:9999;transition:transform 0.3s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
.loading{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9998;}
.loading.hidden{display:none;}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#d4af37;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.94);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(8px);}
.modal-overlay.hidden{display:none;}
.modal-box{background:#1a1a1a;border:1px solid #333;border-radius:24px;padding:28px 24px;width:88%;max-width:340px;text-align:center;}
.modal-icon{font-size:36px;margin-bottom:10px;}
.modal-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;}
.modal-sub{font-size:12px;color:#666;margin-bottom:20px;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #444;background:transparent;transition:all 0.1s;}
.pin-dot.filled{background:#d4af37;border-color:#d4af37;transform:scale(1.1);}
.pin-dot.error{background:#ef4444;border-color:#ef4444;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.numpad-btn{background:#2a2a2a;border:1px solid #383838;color:#fff;font-size:22px;font-weight:600;padding:14px;border-radius:14px;cursor:pointer;user-select:none;transition:all 0.1s;}
.numpad-btn:active{background:#d4af37;color:#000;transform:scale(0.95);}
.numpad-btn.del{color:#ef4444;font-size:18px;}
.numpad-btn.empty{background:transparent;border:none;cursor:default;}
.modal-error{font-size:12px;color:#ef4444;margin-top:12px;min-height:16px;font-weight:500;}
.btn-modal-cancel{background:none;border:none;color:#666;font-size:13px;cursor:pointer;margin-top:16px;padding:8px 20px;text-transform:uppercase;letter-spacing:1px;}
.card-prato{background:#1a1a1a;border:1px solid #222;border-radius:16px;overflow:hidden;margin-bottom:16px;cursor:pointer;transition:transform 0.1s;}
.card-prato:active{transform:scale(0.98);}
.card-img-wrapper{width:100%;height:190px;background:#1f1f1f;}
.card-img{width:100%;height:100%;object-fit:cover;}
.card-body{padding:16px;}
.card-title{font-size:17px;font-weight:700;color:#f5f5f5;}
.card-desc{font-size:13px;color:#a0a0a0;margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-footer{margin-top:14px;display:flex;justify-content:space-between;align-items:center;}
.card-price{color:#d4af37;font-size:18px;font-weight:700;}
.btn-action{background:#d4af37;color:#000;border:none;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:700;text-transform:uppercase;cursor:pointer;}
.empty-menu{text-align:center;padding:80px 20px;color:#555;font-size:14px;}
.empty-menu span{font-size:48px;display:block;margin-bottom:16px;}
.btn-adm-discreto{display:block;width:100%;text-align:center;padding:20px 0 16px;background:none;border:1px solid #333;color:#d4af37;font-size:12px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;border-radius:10px;margin-top:8px;font-weight:600;}
.btn-back{background:none;border:none;color:#a0a0a0;font-size:14px;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;gap:6px;padding:6px 0;}
.detail-img{width:100%;height:220px;object-fit:cover;border-radius:14px;margin-bottom:16px;background:#1a1a1a;}
.detail-title{font-size:22px;font-weight:700;}
.detail-price{color:#d4af37;font-size:20px;font-weight:700;margin-top:4px;}
.detail-desc{color:#a0a0a0;font-size:14px;line-height:1.5;margin-top:10px;padding-bottom:16px;border-bottom:1px solid #222;}
.steps-section{margin-top:18px;padding-bottom:30px;}
.steps-section h3{font-size:11px;text-transform:uppercase;color:#d4af37;letter-spacing:1.5px;margin-bottom:14px;}
.step-item{display:flex;gap:12px;background:#1a1a1a;padding:14px;border-radius:12px;border:1px solid #222;margin-bottom:10px;}
.step-number{width:22px;height:22px;background:#d4af37;color:#000;font-weight:700;font-size:11px;border-radius:50%;display:flex;justify-content:center;align-items:center;flex-shrink:0;}
.step-text{font-size:14px;color:#e0e0e0;line-height:1.5;}
.adm-tabs{display:flex;border-bottom:1px solid #222;margin-bottom:16px;}
.adm-tab-btn{flex:1;background:none;border:none;color:#555;padding:14px;font-size:12px;font-weight:bold;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;}
.adm-tab-btn.active{color:#d4af37;border-bottom-color:#d4af37;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:11px;text-transform:uppercase;color:#a0a0a0;margin-bottom:6px;font-weight:600;letter-spacing:0.5px;}
.form-control{width:100%;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:10px;padding:12px;color:#fff;font-size:14px;outline:none;}
.form-control:focus{border-color:#d4af37;}
.image-preview-box{width:100%;height:150px;background:#1a1a1a;border:2px dashed #333;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;}
.image-preview-box img{width:100%;height:100%;object-fit:cover;}
.image-preview-box p{font-size:12px;color:#555;margin-top:6px;}
.foto-btns{display:flex;gap:8px;margin-top:10px;}
.foto-btn{flex:1;background:#1e1e1e;border:1px solid #2d2d2d;color:#a0a0a0;padding:12px 6px;border-radius:10px;font-size:12px;cursor:pointer;text-align:center;font-weight:500;}
.foto-btn:active{background:#2a2a2a;color:#d4af37;}
.upload-progress{width:100%;height:3px;background:#222;border-radius:2px;margin-top:8px;display:none;}
.upload-progress-bar{height:100%;background:#d4af37;border-radius:2px;width:0%;transition:width 0.3s;}
.step-input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.btn-remove-step{background:none;border:none;color:#ef4444;font-size:16px;cursor:pointer;padding:8px;flex-shrink:0;}
.btn-add-step{background:#1e1e1e;color:#d4af37;border:1px dashed #333;width:100%;padding:12px;border-radius:10px;font-size:12px;cursor:pointer;margin-top:6px;font-weight:600;text-transform:uppercase;}
.btn-submit{width:100%;background:#d4af37;color:#000;border:none;padding:14px;border-radius:10px;font-weight:700;font-size:14px;text-transform:uppercase;cursor:pointer;margin-top:18px;}
.btn-cancel{width:100%;background:none;border:1px solid #2d2d2d;color:#666;padding:12px;border-radius:10px;font-size:13px;cursor:pointer;margin-top:8px;}
.btn-sair-adm{width:100%;background:none;border:1px solid #3a1a1a;color:#ef4444;padding:12px;border-radius:10px;font-size:12px;cursor:pointer;margin-top:24px;font-weight:600;text-transform:uppercase;}
.adm-item-row{background:#1a1a1a;padding:14px;border-radius:14px;border:1px solid #222;margin-bottom:14px;}
.adm-item-main{display:flex;gap:12px;align-items:center;}
.adm-item-thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#252525;}
.adm-item-name{font-size:14px;font-weight:bold;color:#fff;}
.adm-item-price{font-size:13px;color:#d4af37;margin-top:2px;}
.adm-item-actions{display:flex;gap:10px;margin-top:12px;border-top:1px solid #222;padding-top:12px;}
.adm-action-btn{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;text-transform:uppercase;text-align:center;}
.btn-edit{background:#222;color:#fff;border:1px solid #383838;}
.btn-delete{background:#2d1616;color:#ef4444;border:1px solid #4a2020;}
</style></head><body>
<div class="loading hidden" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>
<header><div class="brand"><h1>DIVINO &</h1><p>CUCINA</p></div></header>
<div class="modal-overlay hidden" id="modal-senha">
<div class="modal-box">
<div class="modal-icon">🔑</div>
<div class="modal-title">Acesso Restrito</div>
<div class="modal-sub">Digite o PIN de administrador</div>
<div class="pin-dots">
<div class="pin-dot" id="dot-0"></div><div class="pin-dot" id="dot-1"></div>
<div class="pin-dot" id="dot-2"></div><div class="pin-dot" id="dot-3"></div>
<div class="pin-dot" id="dot-4"></div><div class="pin-dot" id="dot-5"></div>
</div>
<div class="numpad">
<button class="numpad-btn" onclick="pinDigit('1')">1</button>
<button class="numpad-btn" onclick="pinDigit('2')">2</button>
<button class="numpad-btn" onclick="pinDigit('3')">3</button>
<button class="numpad-btn" onclick="pinDigit('4')">4</button>
<button class="numpad-btn" onclick="pinDigit('5')">5</button>
<button class="numpad-btn" onclick="pinDigit('6')">6</button>
<button class="numpad-btn" onclick="pinDigit('7')">7</button>
<button class="numpad-btn" onclick="pinDigit('8')">8</button>
<button class="numpad-btn" onclick="pinDigit('9')">9</button>
<button class="numpad-btn empty"></button>
<button class="numpad-btn" onclick="pinDigit('0')">0</button>
<button class="numpad-btn del" onclick="pinDel()">⌫</button>
</div>
<div class="modal-error" id="modal-error"></div>
<button class="btn-modal-cancel" onclick="fecharModalSenha()">Cancelar</button>
</div></div>
<main>
<div id="screen-menu" class="screen active">
<div id="lista-pratos"></div>
<button class="btn-adm-discreto" onclick="abrirModalSenha()">⚙ ADM</button>
</div>
<div id="screen-detail" class="screen">
<button class="btn-back" onclick="goToMenu()">← Voltar ao Cardápio</button>
<img id="detail-img" src="" class="detail-img" alt="">
<h2 id="detail-title" class="detail-title"></h2>
<div id="detail-price" class="detail-price"></div>
<p id="detail-desc" class="detail-desc"></p>
<div class="steps-section"><h3>Modo de Preparo</h3><div id="detail-steps-list"></div></div>
</div>
<div id="screen-admin" class="screen">
<div class="adm-tabs">
<button class="adm-tab-btn active" id="tab-btn-gerenciar" onclick="switchSubTab('gerenciar')">📋 Gerenciar</button>
<button class="adm-tab-btn" id="tab-btn-form" onclick="switchSubTab('form')">➕ Novo Prato</button>
</div>
<div id="sub-tab-gerenciar">
<div id="adm-lista-controle"></div>
<button class="btn-sair-adm" onclick="sairAdm()">🚪 Sair do ADM</button>
</div>
<div id="sub-tab-form" style="display:none;">
<div class="form-group">
<label>Foto do Prato</label>
<div class="image-preview-box" id="preview-box">
<img id="preview-img" style="display:none;" src="" alt="Preview"/>
<span id="preview-icon" style="font-size:32px;">🍽</span>
<p id="preview-placeholder">Selecione uma foto</p>
</div>
<input type="file" id="file-input-galeria" accept="image/*" style="display:none;" onchange="uploadFoto(event)">
<input type="file" id="file-input-camera" accept="image/*" capture="environment" style="display:none;" onchange="uploadFoto(event)">
<div class="foto-btns">
<button type="button" class="foto-btn" onclick="document.getElementById('file-input-camera').click()">📷 Câmera</button>
<button type="button" class="foto-btn" onclick="document.getElementById('file-input-galeria').click()">🖼 Galeria</button>
<button type="button" class="foto-btn" onclick="toggleUrlInput()">🔗 URL</button>
</div>
<div class="upload-progress" id="upload-progress"><div class="upload-progress-bar" id="upload-progress-bar"></div></div>
<div id="url-input-box" style="display:none;margin-top:10px;">
<input type="url" id="form-img-url" class="form-control" placeholder="https://exemplo.com/foto.jpg" oninput="previewUrl(this.value)">
</div>
</div>
<div class="form-group"><label>Nome do Prato</label><input type="text" id="form-nome" class="form-control" placeholder="Ex: Gnocchi de Batata Doce"></div>
<div class="form-group"><label>Descrição</label><textarea id="form-desc" class="form-control" style="height:70px;resize:none;" placeholder="Descreva o prato..."></textarea></div>
<div class="form-group"><label>Preço (R$)</label><input type="number" id="form-preco" step="0.01" class="form-control" placeholder="52.00" inputmode="decimal"></div>
<div class="form-group">
<label style="color:#d4af37;">Passo a Passo</label>
<div id="steps-inputs-container"></div>
<button type="button" class="btn-add-step" onclick="addStepInputRow('')">+ Adicionar Passo</button>
</div>
<button class="btn-submit" id="btn-salvar-final" onclick="executarSalvar()">Salvar Prato</button>
<button class="btn-cancel" onclick="switchSubTab('gerenciar')">Cancelar</button>
</div></div></main><script>
const SENHA_ADM="903040";
let pinAtual="",imagemAtual="",idPratoEmEdicao=null;
window.onload=()=>carregarCardapio();
async function api(method,path,body=null){
const opts={method,headers:{"Content-Type":"application/json"}};
if(body)opts.body=JSON.stringify(body);
const res=await fetch(path,opts);return res.json();}
async function carregarCardapio(){mostrarLoading(true);try{const p=await api("GET","/api/pratos");renderMenu(p);}finally{mostrarLoading(false);}}
function mostrarLoading(v){document.getElementById("loading").classList.toggle("hidden",!v);}
function showToast(msg){const t=document.getElementById("toast");t.innerText=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}
function abrirModalSenha(){pinAtual="";atualizarDots();document.getElementById("modal-error").innerText="";document.getElementById("modal-senha").classList.remove("hidden");}
function fecharModalSenha(){pinAtual="";atualizarDots();document.getElementById("modal-senha").classList.add("hidden");}
function pinDigit(d){if(pinAtual.length>=6)return;pinAtual+=d;atualizarDots();if(pinAtual.length===6)setTimeout(verificarSenha,100);}
function pinDel(){pinAtual=pinAtual.slice(0,-1);atualizarDots();document.getElementById("modal-error").innerText="";for(let i=0;i<6;i++)document.getElementById("dot-"+i).classList.remove("error");}
function atualizarDots(){for(let i=0;i<6;i++){const d=document.getElementById("dot-"+i);d.classList.remove("filled","error");if(i<pinAtual.length)d.classList.add("filled");}}
function verificarSenha(){if(pinAtual===SENHA_ADM){fecharModalSenha();goToAdmin();}else{document.getElementById("modal-error").innerText="PIN incorreto.";for(let i=0;i<6;i++){document.getElementById("dot-"+i).classList.remove("filled");document.getElementById("dot-"+i).classList.add("error");}setTimeout(()=>{pinAtual="";atualizarDots();document.getElementById("modal-error").innerText="";},1200);}}
function switchScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0);if(id!=="screen-admin")idPratoEmEdicao=null;}
function switchSubTab(tab){document.getElementById("sub-tab-gerenciar").style.display=tab==="gerenciar"?"block":"none";document.getElementById("sub-tab-form").style.display=tab==="form"?"block":"none";document.getElementById("tab-btn-gerenciar").classList.toggle("active",tab==="gerenciar");document.getElementById("tab-btn-form").classList.toggle("active",tab==="form");if(tab==="form"&&idPratoEmEdicao===null)resetFormulario();}
function goToMenu(){carregarCardapio();switchScreen("screen-menu");}
async function goToAdmin(){switchScreen("screen-admin");switchSubTab("gerenciar");await carregarListaADM();}
function sairAdm(){goToMenu();}
function renderMenu(pratos){const c=document.getElementById("lista-pratos");if(!pratos||pratos.length===0){c.innerHTML='<div class="empty-menu"><span>🍽</span>Nenhum prato no cardápio ainda.</div>';return;}c.innerHTML=pratos.map(p=>`<div class="card-prato" onclick="verDetalhes('${p.id}')"><div class="card-img-wrapper"><img src="${p.imagem_url}" class="card-img" onerror="this.style.display='none'"></div><div class="card-body"><div class="card-title">${p.nome}</div><div class="card-desc">${p.descricao}</div><div class="card-footer"><div class="card-price">R$ ${parseFloat(p.preco).toFixed(2).replace(".",",")}</div><button class="btn-action" onclick="event.stopPropagation();verDetalhes('${p.id}')">Ver Receita</button></div></div></div>`).join("");}
async function verDetalhes(id){mostrarLoading(true);try{const pratos=await api("GET","/api/pratos");const p=pratos.find(x=>x.id===id);if(!p)return;document.getElementById("detail-img").src=p.imagem_url;document.getElementById("detail-title").innerText=p.nome;document.getElementById("detail-price").innerText=`R$ ${parseFloat(p.preco).toFixed(2).replace(".",",")}`;document.getElementById("detail-desc").innerText=p.descricao;document.getElementById("detail-steps-list").innerHTML=p.passos.map((s,i)=>`<div class="step-item"><div class="step-number">${i+1}</div><div class="step-text">${s}</div></div>`).join("");switchScreen("screen-detail");}finally{mostrarLoading(false);}}
async function carregarListaADM(){mostrarLoading(true);try{const pratos=await api("GET","/api/pratos");const c=document.getElementById("adm-lista-controle");if(!pratos||pratos.length===0){c.innerHTML='<p style="font-size:13px;color:#555;text-align:center;padding:40px 0;">Nenhum prato cadastrado.</p>';return;}c.innerHTML=pratos.map(p=>`<div class="adm-item-row"><div class="adm-item-main"><img src="${p.imagem_url}" class="adm-item-thumb" onerror="this.style.background='#2a2a2a'"><div><div class="adm-item-name">${p.nome}</div><div class="adm-item-price">R$ ${parseFloat(p.preco).toFixed(2).replace(".",",")}</div></div></div><div class="adm-item-actions"><button class="adm-action-btn btn-edit" onclick="prepararEdicao('${p.id}')">✏️ Editar</button><button class="adm-action-btn btn-delete" onclick="removerPrato('${p.id}','${p.nome}')">🗑 Excluir</button></div></div>`).join("");}finally{mostrarLoading(false);}}
async function removerPrato(id,nome){if(!confirm(`Excluir "${nome}"?`))return;mostrarLoading(true);try{await api("DELETE",`/api/pratos/${id}`);showToast("Prato excluído!");await carregarListaADM();}finally{mostrarLoading(false);}}
async function prepararEdicao(id){mostrarLoading(true);try{const pratos=await api("GET","/api/pratos");const p=pratos.find(x=>x.id===id);if(!p)return;idPratoEmEdicao=id;document.getElementById("form-nome").value=p.nome;document.getElementById("form-desc").value=p.descricao;document.getElementById("form-preco").value=p.preco;mostrarPreview(p.imagem_url);imagemAtual=p.imagem_url;document.getElementById("steps-inputs-container").innerHTML="";p.passos.forEach(s=>addStepInputRow(s));document.getElementById("btn-salvar-final").innerText="Atualizar Prato";switchSubTab("form");}finally{mostrarLoading(false);}}
function resetFormulario(){document.getElementById("form-nome").value="";document.getElementById("form-desc").value="";document.getElementById("form-preco").value="";document.getElementById("preview-img").style.display="none";document.getElementById("preview-icon").style.display="block";document.getElementById("preview-placeholder").style.display="block";document.getElementById("url-input-box").style.display="none";document.getElementById("form-img-url").value="";imagemAtual="";document.getElementById("steps-inputs-container").innerHTML="";addStepInputRow("");idPratoEmEdicao=null;document.getElementById("btn-salvar-final").innerText="Salvar Prato";}
function mostrarPreview(src){const img=document.getElementById("preview-img");img.src=src;img.style.display="block";document.getElementById("preview-icon").style.display="none";document.getElementById("preview-placeholder").style.display="none";}
async function uploadFoto(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>mostrarPreview(e.target.result);reader.readAsDataURL(file);const prog=document.getElementById("upload-progress");const bar=document.getElementById("upload-progress-bar");prog.style.display="block";bar.style.width="30%";const form=new FormData();form.append("foto",file);try{bar.style.width="70%";const res=await fetch("/api/upload",{method:"POST",body:form});const data=await res.json();bar.style.width="100%";if(data.url){imagemAtual=data.url;mostrarPreview(data.url);showToast("Foto salva! ✅");}}catch(e){showToast("Erro no upload.");}finally{setTimeout(()=>{prog.style.display="none";bar.style.width="0%";},800);event.target.value="";}}
function toggleUrlInput(){const box=document.getElementById("url-input-box");box.style.display=box.style.display==="none"?"block":"none";if(box.style.display==="block")document.getElementById("form-img-url").focus();}
function previewUrl(url){if(!url)return;imagemAtual=url;mostrarPreview(url);}
async function executarSalvar(){const nome=document.getElementById("form-nome").value.trim();const desc=document.getElementById("form-desc").value.trim();const preco=document.getElementById("form-preco").value.trim();if(!nome||!desc||!preco){alert("Preencha todos os campos!");return;}const passos=[...document.querySelectorAll(".step-input-item")].map(i=>i.value.trim()).filter(Boolean);const body={nome,descricao:desc,preco:parseFloat(preco),imagem_url:imagemAtual||"",passos};mostrarLoading(true);try{if(idPratoEmEdicao){await api("PUT",`/api/pratos/${idPratoEmEdicao}`,body);showToast("Atualizado! ✅");}else{await api("POST","/api/pratos",body);showToast("Prato adicionado! ✅");}idPratoEmEdicao=null;await carregarListaADM();switchSubTab("gerenciar");}finally{mostrarLoading(false);}}
function addStepInputRow(val){const c=document.getElementById("steps-inputs-container");const n=c.children.length+1;const row=document.createElement("div");row.className="step-input-row";row.innerHTML=`<span style="font-size:12px;color:#555;width:18px;flex-shrink:0;text-align:center;">${n}</span><input type="text" class="form-control step-input-item" value="${val}" placeholder="Descreva esta etapa..."><button type="button" class="btn-remove-step" onclick="this.parentElement.remove();reindex();">✕</button>`;c.appendChild(row);}
function reindex(){document.querySelectorAll(".step-input-row").forEach((r,i)=>r.querySelector("span").innerText=i+1);}
</script></body></html>
